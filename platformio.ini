[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

lib_ldf_mode = deep+

; Зависимости библиотек для декодера VS1053 и SD-карты
lib_deps = 
    adafruit/Adafruit VS1053 Library @ ^1.4.1
    arduino-libraries/SD @ ^1.3.0
    SPI
    Wire

; Оптимизация по размеру (-Os) для укладывания в 32 КБ Flash и 2 КБ SRAM
build_flags = 
    -Os
    -Wall
